[[outside_corpus]]
input = "SEATS (2,1,1)(0,0,1) log with a zero trend-cycle numerator and a negative irregular spectrum (FRED series MIURN on row U-12n)"
rust = "UnusableNumerator { .. }"
fortran = "hang; the 600 s deadline expires"
reason = "SPECTRUM calls ShowInvalDecomp before its 7052 rejection, which passes its uninitialised local THETP to MAspectrum. With a zero trend-cycle numerator MAK1 computes VAR = 0/THETP(1)**2 from stack contents; a NaN SA numerator spins C02AEF forever. A benign value gives the 7052 rejection, as on U-17b; Rust rejects the nonpositive SA numerator before MAK1."

[[outside_corpus]]
input = "Any observation equal to -99999 within dpeq's tolerance"
rust = "an ordinary observation; NaN is the only gap marker"
fortran = "a missing value (Mvcode): regARIMA estimates it, direct X-11 rejects it"
reason = "Callers mark gaps with NaN, so a reserved code could only misread real data. Build 62 cannot take the value as data, so there is nothing to compare with."

[[outside_corpus]]
input = "A regARIMA-X-11 or SEATS series with gaps whose first value is observed and whose observed values are equal under dpeq, e.g. all 5s with one gap"
rust = "the gaps take the constant, so the result is that of the same series without gaps; for zeros that is AllZeroInput"
fortran = "success with values the input cannot produce, a rejection, or no saved adjustment, depending on the constant, the path and the gap's position"
reason = "editor.f computes Same over the observed values, so x11ari.f skips the model that would estimate the gap and the series is decomposed with the 1e9 filler in the gap, giving values up to 1.5e12 on a series of 5s. Build 62 gives the constant back when missingval is set to it, which is what Rust does. Zeros stay refused, as zeros without gaps are, though Build 62 with missingval=0 returns zeros; under pseudo-additive its 1e9 filler reaches the 0/0 at X11PT2/DIVSUB that CTQ05TCNR/{04,62} lists. A leading gap is not covered: editor.f seeds its extremes from the missing code, so Same is false and the model runs."

[[outside_corpus]]
input = "An explicit regARIMA model on which rgarma.f's own filter call fails, for example intgpg.f can't factor G'G on all 5s with leading gaps"
rust = "Numerical(NumericalFailure(ExactLikelihoodUnavailable { .. }))"
fortran = "success with zero variance and no likelihood; SA can look sensible and forecasts can explode, up to 3.3e30 on a series of 5s"
reason = "The deviation rests on this invalid state, not on the output. The filter fails, for example intgpg.f can't factor G'G and armafl.f returns PGPGER; models with AR terms could return PACFER or PVWPER instead. chkrt2.f never sets Inverr, so rgarma.f sets Var=0 and abandons the fit, prterr.f has no branch for the error, and the run continues, on a partial factor in the G'G case. Other inputs that reach ExactLikelihoodUnavailable are not covered: they have not been compared with Build 62."

[[outside_corpus]]
input = "ARMA coefficients (-1, 1, 1) or (0.5, 0, 0.5), whose roots all lie exactly on the unit circle"
rust = "no root strictly inside (previous MA starting values accepted)"
fortran = "a root strictly inside (previous MA starting values rejected)"
reason = "Every root has modulus exactly 1; Build 62's answer is RPOLY rounding, and it answers the mirror (1, 1, -1) the other way. The Rust solver returns those roots exactly."

[[outside_corpus]]
input = "Monthly series, usually with an extreme value, whose spectral peak test stalls Build 62 (ten fuzz cases on rows such as 41, 42, 48 and 95)"
rust = "success"
fortran = "hang past 585 s in spcdrv, idpeak, shlsrt; the tables written before the stall agree"
reason = "idpeak.f sorts a 61-element spectrum with shlsrt, a Shell sort that ends only on a total order. NaN in the spectrum would break that order; this is inferred from one stack sample, not inspected in all ten cases. Build 62 leaves no complete result to match."

[[outside_corpus]]
input = "A series dated in a very large year, e.g. a start in 9999 or 99999"
rust = "success"
fortran = "rejected: dtoc.f stops with \"Cannot write ... in 21 spaces.\""
reason = "The refusal comes from Build 62's number formatting, not from the series or the model: the same data agrees at year 2000. Rust has no such limit. The year where the refusal starts is unknown."

[[outside_corpus]]
input = "A leading gap with every observed value exactly 1e9, log transform, flow trading day and a leap-year length treatment (15 cases on rows 41, 42, 78, 81 and U-10)"
rust = "success"
fortran = "rejected: Differencing has annihilated the series"
reason = "Rust's transformed series carries the leap-year prior, so its differenced series is not all zero and the annihilation check does not fire. Why Build 62's series has no prior at that check is untraced."
