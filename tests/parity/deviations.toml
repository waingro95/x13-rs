reason = "As row 89 on (1,0,0)(1,1,0): AUTO's nw (its Na argument) = IQ = 15 leaves no diagnostic sample. A trapping build stops at the ANSUB1 AUTO:1865 division (called at analts.f:2630); the reference executable signals IEEE_INVALID_FLAG and continues. Rust returns the invalid-diagnostic-sample error."

