[[deviations]]
pattern = "{NA000348Q,QFR101PTSUSNO}/89"
output = "outcome"
fortran = "success"
rust = 'rejected: Numerical(NumericalFailure(Seats \{ stage: Mean, failure: AutocorrelationSample \{ count: 16 \} \}))'
reason = "These 24-observation quarterly BP=1/Q=1 inputs leave Na=16 extended residuals, while ANALTS retains IQ=16 from the Nw=19 differenced sample. ANSUB1 AUTO:1865 computes r(16)^2/(Na-16)=0/0, where an invalid-trapping build stops. The NaN Qstat feeds ANALTS retry selection; Build 62 signals IEEE_INVALID_FLAG and continues without a valid fit diagnostic. Rust returns a contextual invalid-diagnostic-sample error before that division. U-12i (IQ=15) traps at the same division."

