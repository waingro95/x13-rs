rust = "Numerical: Unusable { quantity: \"imported regular AR coefficient\", .. }"
fortran = "hangs in SEATS; the NaN AR coefficients reach RPQ"
reason = "0/0 when phi3 is reset to 1 with phi1 + phi2 = 0, when phi3 = -1 with phi1 = phi2, or when X(1) is reset to -1 with X(2) = 0; inf/inf when both sums overflow. TRANS0 clips every other infinity to +-1, which Rust reproduces."

