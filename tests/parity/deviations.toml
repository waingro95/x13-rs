# Cases where this crate differs from Build 62 on purpose. Each entry needs a
# reason, and the list changes only with a maintainer's agreement
# (CONTRIBUTING.md).
# [[outside_corpus]] lists cases no corpus case reaches; the harness never
# matches them.
# Optional expected_matches is the number of cases a wildcard entry must match;
# a full run fails on any other count.

[[deviations]]
pattern = "{EXP7580,IMP4751,IMP6142}/{04,62}"
output = "outcome"
fortran = "success"
rust = "rejected: Numerical(NumericalFailure(X11PseudoAdditive *stage: SeasonalIrregular, index: 6, period: 1992-07, reason: ZeroDivisor*"
reason = "Six cases: unchanged Build 62 with floating-point trapping stops at X11PT2:430/DIVSUB, dividing zero observations by a zero initial centered trend. The reference executable continues and reports zero adjusted values for 202, 253 and 241 nonzero observations in EXP7580, IMP4751 and IMP6142 respectively, in both rows. There is no defined ratio, and Build 62 has no recovery from it. Rust returns the dated zero-divisor error rather than corrupted components."

