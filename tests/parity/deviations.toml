[[outside_corpus]]
input = "SEATS AR(2) import with phi1 = 0 and |1 - phi2| < 1e-9"
rust = "Numerical: Unusable { quantity: \"imported regular AR coefficient\", .. }"
fortran = "hangs in SEATS; TRANS0's 0/0 leaves a NaN AR coefficient"
reason = "TRANS0 resets phi2 to 1, so first/(1 - second) is 0/0. A nonzero phi1 gives an infinity that TRANS0 clips to +-1, which Rust reproduces."

[[outside_corpus]]
