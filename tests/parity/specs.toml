# The rows of docs/parity-call-table.md, one [[specs]] entry per row. Each row
# varies its section's baseline. A series shorter than `length.min` skips the
# row; a longer one is cut to its most recent `length.max` observations,
# usually the most Build 62 accepts for that configuration.

