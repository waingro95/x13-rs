# The FRED corpus of the parity harness.
# Every series comes from a U.S. federal agency (public domain) via
# https://fred.stlouisfed.org/graph/fredgraph.csv?id=<id>. Files keep FRED's
# CSV layout, gaps included, capped at the most recent 780 observations
# (Build 62 POBS). `missing` lists the empty months or quarters; BLS skipped
# October 2025 during the shutdown.
# `truncated = true` marks series deliberately cut to a 6-10 year span.
# `downloaded` is the date each file was fetched. Refetching changes the
# corpus, so it is done on purpose and never as a side effect.

